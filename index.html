<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhilash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Syne:wght@500;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       DESIGN TOKENS — "The Book" Agency Comp-Card Spec
       ========================================================================== */
    :root {
      --bg-dark: #0E0E0E;
      --bg-light: #F7F6F3;
      --text-on-dark: #FFFFFF;
      --text-muted: #8A8A85;
      /* Accent #C9A876 — Strictly max 3 uses site-wide:
         1. Hero editorial badge dot
         2. Editorial thin divider line before footer
         3. Interactive link hover-underline
      */
      --accent: #C9A876;

      --font-display: 'Italiana', Didot, 'Bodoni MT', 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-dark);
      color: var(--text-on-dark);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      overflow-x: hidden;
      width: 100%;
    }

    /* Accessibility focus */
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* ==========================================================================
       1. HERO SECTION
       Full-viewport (100vh), name bottom-left overlay, single fade-in on load only
       ========================================================================== */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      opacity: 0;
      animation: heroEntrance 1.1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    @keyframes heroEntrance {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      display: block;
    }

    .hero-meta {
      position: absolute;
      bottom: clamp(2rem, 5vw, 4.5rem);
      left: clamp(1.5rem, 5vw, 5rem);
      z-index: 10;
      pointer-events: none;
    }



    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(4rem, 11vw, 10.5rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: var(--text-on-dark);
      text-transform: none;
    }

    /* ==========================================================================
       2. EDITORIAL GALLERY CONTAINER & VERTICAL RHYTHM
       Spaced spreads, no cards, no borders, no rounded corners, no shadows.
       ========================================================================== */
    .gallery-flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(5rem, 11vw, 10rem); /* Substantial breathing room between spreads */
      padding-top: clamp(5rem, 10vw, 8.5rem);
      padding-bottom: clamp(6rem, 12vw, 10rem);
    }

    /* Spread: 2-Up Split */
    .spread-2up {
      width: 100%;
      padding: 0 clamp(1.5rem, 4vw, 4rem);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(1rem, 2.5vw, 2.5rem);
      align-items: stretch;
    }

    .spread-2up .photo-frame {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background-color: #141414;
    }

    .spread-2up .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Spread: Full-Bleed Landscape Anchor */
    .spread-fullbleed {
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #141414;
    }

    .spread-fullbleed .photo-frame {
      width: 100%;
      line-height: 0;
    }

    .spread-fullbleed img {
      width: 100%;
      height: auto;
      max-height: 90vh;
      object-fit: cover;
      display: block;
    }

    /* Spread: Closer (Square 1:1 preserved with negative space) */
    .spread-closer {
      width: 100%;
      padding: 0 clamp(1.5rem, 4vw, 4rem);
      display: flex;
      justify-content: center;
    }

    .spread-closer .closer-inner {
      width: min(100%, 640px);
    }

    .spread-closer .photo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #141414;
    }

    .spread-closer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ==========================================================================
       3. MINIMAL FOOTER
       Phone, Email, Instagram — left-aligned, one line, quiet styling.
       ========================================================================== */
    /* Accent usage #2: single refined accent line above footer */
    .site-footer {
      border-top: 1px solid var(--accent);
      padding: clamp(2.5rem, 5vw, 4rem) clamp(1.5rem, 5vw, 5rem);
      background-color: var(--bg-dark);
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 1.5rem clamp(1.5rem, 3vw, 3rem);
      font-size: 0.8125rem;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      text-align: left;
    }

    .contact-item {
      display: inline-flex;
      align-items: baseline;
      gap: 0.35rem;
    }

    .contact-label {
      color: var(--text-muted);
    }

    .contact-link {
      color: var(--text-on-dark);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    /* Accent usage #3: hover underline on links */
    .contact-link:hover {
      color: #FFFFFF;
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-underline-offset: 4px;
    }

    .footer-divider {
      color: rgba(255, 255, 255, 0.15);
      user-select: none;
    }

    /* ==========================================================================
       4. RESPONSIVE BREAKPOINTS
       Pairs stack vertically on smaller screens, keeping full-bleed edge-to-edge
       ========================================================================== */
    @media (max-width: 820px) {
      .spread-2up {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding: 0 1.25rem;
      }

      .spread-2up .photo-frame {
        aspect-ratio: 4 / 5;
      }

      .gallery-flow {
        gap: 4.5rem;
        padding-top: 4.5rem;
        padding-bottom: 5.5rem;
      }

      .spread-closer {
        padding: 0 1.25rem;
      }

      .spread-closer .closer-inner {
        width: 100%;
      }

      .footer-content {
        flex-direction: column;
        gap: 0.75rem;
      }

      .footer-divider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 1. HERO — full-viewport, name bottom-left overlay, single fade-in on load only -->
  <header class="hero" id="hero">
    <img 
      src="optimized/20260107_170428.webp" 
      alt="Abhilash model portrait" 
      class="hero-img"
    >
    <div class="hero-meta">
      <h1 class="hero-title">Abhilash</h1>
    </div>
  </header>

  <!-- 2. EDITORIAL GALLERY -->
  <main class="gallery-flow">

    <!-- OPENER: 2-up editorial spread (Stark B&W + Saturated Purple Color Pop) -->
    <section class="spread-2up" id="opener" aria-label="Opener spread">
      <div class="photo-frame">
        <img src="optimized/IMG-20240529-WA0073.webp" alt="Streetwear B&W portrait with graphic shadow lines">
      </div>
      <div class="photo-frame">
        <img src="optimized/IMG-20240529-WA0145.webp" alt="Editorial fashion pose in violet graphic tee">
      </div>
    </section>

    <!-- FULL-BLEED ANCHOR: Landscape motion walk, edge-to-edge, zero crop distortion -->
    <section class="spread-fullbleed" id="anchor" aria-label="Full-bleed motion walk">
      <div class="photo-frame">
        <img src="optimized/IMG-20240529-WA0079.webp" alt="Abhilash motion capture stride with backpack">
      </div>
    </section>

    <!-- CONTRAST PAIR (2-up): Warm sunlit street / Moody hooded urban tone -->
    <section class="spread-2up" id="contrast" aria-label="Urban contrast pair">
      <div class="photo-frame">
        <img src="optimized/20260107_162828.webp" alt="Warm daylight street portrait">
      </div>
      <div class="photo-frame">
        <img src="optimized/20260107_170737(0).webp" alt="Moody hooded streetwear with dark sunglasses">
      </div>
    </section>

    <!-- TEXTURE & ARCHITECTURE PAIR (2-up): Crimson colonial facade / Door gesture pose -->
    <section class="spread-2up" id="texture" aria-label="Architectural and texture pair">
      <div class="photo-frame">
        <img src="optimized/20260107_170204(0).webp" alt="Colonial crimson facade profile pose">
      </div>
      <div class="photo-frame">
        <img src="optimized/20260107_170435.webp" alt="Textured wooden door editorial fashion pose">
      </div>
    </section>

    <!-- CLOSER: Native 1:1 square ratio preserved, centered with negative space -->
    <section class="spread-closer" id="closer" aria-label="Closer portrait">
      <div class="closer-inner">
        <div class="photo-frame">
          <img src="optimized/IMG_20240530_091257_319.webp" alt="Square 1:1 high-contrast black and white portrait">
        </div>
      </div>
    </section>

  </main>

  <!-- 3. MINIMAL FOOTER: Phone, Email, Instagram — left-aligned, one line, quiet styling -->
  <footer class="site-footer" id="contact">
    <div class="footer-content">
      <div class="contact-item">
        <span class="contact-label">Phone:</span>
        <a href="tel:8008109465" class="contact-link">8008109465</a>
      </div>
      <span class="footer-divider">/</span>
      <div class="contact-item">
        <span class="contact-label">Email:</span>
        <a href="mailto:abhilashsathuri@gmail.com" class="contact-link">abhilashsathuri@gmail.com</a>
      </div>
      <span class="footer-divider">/</span>
      <div class="contact-item">
        <span class="contact-label">Instagram:</span>
        <a href="https://www.instagram.com/abhilashh_15_" target="_blank" rel="noopener noreferrer" class="contact-link">@abhilashh_15_</a>
      </div>
    </div>
  </footer>
</body>
</html>
